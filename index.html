<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#11131F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Personal gym tracker">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
html{overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:26;background:var(--bg)}
.backup{display:flex;flex-direction:column;gap:10px}
.backup .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.backup .ghost{height:50px}
</style>
<title>Lift Buddy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one thumb-reach column. Progress ring on top, one big "current set" card, the rest of the day below, rest timer docked at the bottom. */
:root{
  --bg:#F2F4FA; --card:#FFFFFF; --ink:#1B1D33; --muted:#666C8C; --line:#DFE4F1; --soft:#E9EDF8;
  --accent:#F04A3A; --accent-ink:#FFFFFF; --accent-soft:#FFE4E0;
  --ok:#0E9C6E; --ok-soft:#DBF4EA; --sun:#FFC53D; --blush:#FF9D94;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11131F; --card:#1B1E30; --ink:#F1F2FA; --muted:#959BBB; --line:#2B2F49; --soft:#262A42;
  --accent:#FF6A5B; --accent-ink:#21090A; --accent-soft:#40201F;
  --ok:#3DD6A3; --ok-soft:#173A31; --sun:#FFD15C; --blush:#C9544C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11131F; --card:#1B1E30; --ink:#F1F2FA; --muted:#959BBB; --line:#2B2F49; --soft:#262A42;
  --accent:#FF6A5B; --accent-ink:#21090A; --accent-soft:#40201F;
  --ok:#3DD6A3; --ok-soft:#173A31; --sun:#FFD15C; --blush:#C9544C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:14px 220px}
.view{display:flex;flex-direction:column;gap:14px}
.vh{font-family:var(--display);font-weight:600;font-size:28px;margin:4px 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;max-width:480px;margin:0 auto}
.tabs button{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);border-radius:14px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pday{display:flex;flex-direction:column;gap:8px}
.phead{display:flex;align-items:center;gap:10px}
.pname{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--display);font-weight:600;font-size:22px;padding:4px 2px;border-bottom:2px dashed var(--line);border-radius:0}
.prow{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.prow small,.row .body small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.mv{display:flex;flex-direction:column;gap:4px;flex:none}
.mv button{width:40px;height:32px;border-radius:10px;background:var(--soft);font-weight:800;color:var(--muted)}
.mv button:disabled{opacity:.3}
.vol{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-weight:800;font-size:14px}
.vol .trk{position:relative;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.vol .trk i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--ok)}
.vol .trk i.low{background:var(--sun)} .vol .trk i.high{background:var(--accent)}
.vol .trk::before,.vol .trk::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.55;z-index:1}
.vol .trk::before{left:41.7%} .vol .trk::after{left:83.3%}
.vol .n{font-variant-numeric:tabular-nums;text-align:right;min-width:28px}
.focus h2.sm{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.focus .note{color:var(--muted);font-size:13px;font-weight:700;margin:0}
.search{width:100%;height:50px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px var(--body);padding:0 14px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:800;font-size:13.5px;color:var(--muted)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.row{cursor:pointer}
.ph{display:block;position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:inherit;background:var(--soft)}
.ph i{position:absolute;inset:0;background-size:200% 100%;background-repeat:no-repeat}
.ph i.b{background-position:100% 0;animation:phx 2.8s infinite}
@keyframes phx{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
.pht{display:block;width:46px;height:31px;border-radius:8px;background-image:url(img/thumbs.jpg);background-repeat:no-repeat}
.holdbox{background:var(--soft);border-radius:18px;padding:12px 10px 14px;text-align:center}
.holdt{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.05;font-variant-numeric:tabular-nums}
.holdt.hit{color:var(--ok)}
.holdsub{color:var(--muted);font-weight:800;font-size:13px}
.focus .linkbtn{padding:4px 16px}
.figbtn:has(.ph){width:108px;height:72px;overflow:hidden}
.sheet>*{flex-shrink:0}
.sheet .big.photo{display:block;padding:0;overflow:hidden}
.sheet .big.photo+.big svg{max-width:210px}
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-family:var(--display);font-weight:600;font-size:20px}
.calh button{width:46px;height:42px;border-radius:13px;background:var(--soft);font-size:22px;font-weight:800;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.cd{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14.5px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums}
.cd.on{background:var(--ok-soft);color:var(--ok)}
.cd.on i{font-style:normal;font-size:9px;margin-top:2px;text-transform:uppercase}
.cd.open{background:var(--accent-soft);color:var(--accent)}
.cd.today{outline:2px solid var(--muted);outline-offset:-2px}
.editbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
.editbar button{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800}
.spark{width:96px;height:34px;flex:none}
.spark .ln{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:var(--ok);opacity:.14} .spark .pt{fill:var(--ok)}
.sheet .spark{width:100%;height:auto}
.delta{flex:none;min-width:44px;text-align:right;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta.up{color:var(--ok)} .delta.down{color:var(--accent)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:12px;background:var(--soft)}
.hist span:first-child{color:var(--muted);flex:none}
.hist span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pe{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pe .step output{font-family:var(--display);font-weight:700;font-size:26px;text-align:center;font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:14px}
.ringwrap{position:relative;width:76px;height:76px;flex:none}
.ringwrap svg.ring{width:76px;height:76px;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--soft);stroke-width:7}
.ring .pg{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,1.4,.5,1)}
.buddy{position:absolute;inset:13px;width:50px;height:50px}
.b-body{fill:var(--accent)} .b-rim{fill:none;stroke:var(--accent-ink);stroke-opacity:.25;stroke-width:2}
.b-eyes circle{fill:var(--accent-ink)} .b-sleep,.b-mouth{fill:none;stroke:var(--accent-ink);stroke-width:2.2;stroke-linecap:round}
.b-blush{fill:var(--blush)} .b-sleep{display:none}
.buddy.rest .b-eyes{display:none} .buddy.rest .b-sleep{display:block}
.buddy.rest{animation:breathe 3s ease-in-out infinite}
.buddy.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.b-eyes{animation:blink 4.5s infinite;transform-origin:24px 22px}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-9px) scale(1.08,.94)}70%{transform:translateY(2px) scale(.96,1.05)}100%{transform:none}}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.titles{flex:1;min-width:0}
.titles h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0}
.titles p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pct{font-family:var(--display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.pct small{font-size:18px;color:var(--muted);font-weight:600}

.days{display:flex;gap:8px}
.days button{flex:1;padding:10px 6px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* focus card */
.focus{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 24px -14px rgba(20,24,60,.35)}
.fhead{display:flex;gap:12px;align-items:center}
.figbtn{flex:none;width:84px;height:70px;border-radius:16px;background:var(--soft);display:grid;place-items:center;position:relative}
.figbtn svg{width:78px;height:65px}
.figbtn::after{content:"i";position:absolute;right:5px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--card);color:var(--muted);font:800 11px/16px var(--body);text-align:center}
.fhead h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.fhead .meta{color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}
.fig .bd{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fig .fz{fill:none;stroke:var(--muted);stroke-opacity:.45;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:var(--ink)} .fig .pp{fill:var(--accent)}
.goal{background:var(--accent-soft);border-radius:14px;padding:9px 12px;font-weight:700;font-size:14.5px}
.goal b{font-weight:800}
.goal.first{background:var(--soft)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps.one{grid-template-columns:1fr}
.step{background:var(--soft);border-radius:18px;padding:8px 6px 6px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;row-gap:0}
.step label{grid-column:1/-1;text-align:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step button{width:48px;height:52px;border-radius:14px;background:var(--card);font-family:var(--display);font-size:28px;font-weight:600;line-height:1;user-select:none;-webkit-user-select:none}
.step button:active{transform:scale(.92)}
.step input{width:100%;min-width:0;border:0;background:none;color:var(--ink);text-align:center;font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.18)}}
.go{height:66px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 0 color-mix(in srgb,var(--accent) 70%,#000);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 0 color-mix(in srgb,var(--accent) 70%,#000)}
.go svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}

/* set chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:34px;height:30px;padding:0 9px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.now{border-color:var(--accent);color:var(--accent)}
.chip.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.chip.pr::after{content:"PR";margin-left:5px;background:var(--sun);color:#3A2A00;border-radius:6px;padding:0 4px;font-size:10px}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* list */
.listh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 4px -6px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:18px;background:var(--card)}
.row.cur{outline:2px solid var(--accent)}
.row.fin .nm{color:var(--muted)}
.row .mini{flex:none;width:46px;height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center}
.row .mini svg{width:42px;height:35px}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .nm{font-weight:800;font-size:15.5px}
.linkbtn{align-self:center;color:var(--muted);font-weight:800;font-size:14px;padding:12px 16px;text-decoration:underline;text-underline-offset:3px}
.sync{text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;margin:0}

/* done-for-today card */
.donecard{background:var(--card);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.donecard h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.donecard p{margin:0;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--soft);border-radius:16px;padding:10px 4px}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ghost{height:54px;padding:0 22px;border-radius:18px;background:var(--soft);font-weight:800;width:100%}

/* rest bar */
.rest{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px -12px rgba(20,24,60,.4);animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(100%)}}
.rest .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.rest .t{font-family:var(--display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;min-width:86px}
.rest .lab{flex:1;min-width:0;font-weight:800;color:var(--muted);font-size:13px;line-height:1.25}
.rest .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;max-width:480px;margin:0 auto 8px}
.rest .bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .5s linear}
.rest button{height:46px;padding:0 14px;border-radius:14px;background:var(--soft);font-weight:800}
.rest.go-now .t{color:var(--ok)}

/* sheet + finish overlay */
.veil{position:fixed;inset:0;z-index:30;background:rgba(10,12,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
.sheet .big{background:var(--soft);border-radius:20px;display:grid;place-items:center;padding:8px}
.sheet .big svg{width:100%;max-width:300px;height:auto}
.sheet h3{font-family:var(--display);font-weight:600;font-size:24px;margin:0}
.sheet .mus{color:var(--accent);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.sheet p{margin:0;font-weight:500}
.sheet .note{color:var(--muted);font-size:13px;font-weight:700}
.sheet{max-height:92vh;overflow-y:auto}
.sheet .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .pair .big{padding:6px;min-width:0}
.mm{width:100%;height:auto;max-width:190px}
.mm .base *{fill:color-mix(in srgb,var(--muted) 28%,transparent)}
.mm .p{fill:var(--accent)} .mm .s{fill:var(--accent);opacity:.36}
.mm text{fill:var(--muted);font:800 10px var(--body);text-anchor:middle}
.legend{display:flex;gap:14px;font-size:12.5px;font-weight:800;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.s{opacity:.36}
.swapbtn{margin-left:auto;align-self:flex-start;flex:none;height:36px;padding:0 12px;border-radius:999px;background:var(--soft);font-weight:800;font-size:13px;color:var(--muted)}
.fhead>div{flex:1;min-width:0}
.gorow{display:flex;gap:10px}
.gorow .go{flex:1}
.del{flex:none;height:66px;padding:0 16px;border-radius:20px;background:var(--soft);font-weight:800;color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--soft);font-weight:800}
.opt .mini{flex:none;width:46px;height:40px;border-radius:11px;background:var(--card);display:grid;place-items:center}
.opt .mini svg{width:42px;height:35px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt small{display:block;font-weight:700;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{min-height:50px;padding:6px 10px;border-radius:14px;background:var(--soft);font-weight:800}
.subh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.addbtn{height:56px;border-radius:18px;border:2px dashed var(--line);color:var(--muted);font-weight:800;width:100%;margin-top:8px}
.listh small{text-transform:none;letter-spacing:0;font-weight:700;font-size:12.5px}

const progDay=s=>PROGRAM[s.day]||PROGRAM[0];
const planOf=s=>s.plan||progDay(s).ex;
const baseOf=s=>planOf(s).concat(s.extra||[]);
const dayOf=s=>{const d=progDay(s);return {name:s.pname||d.name,ex:baseOf(s).filter(p=>EX[p.id]).map((p,i)=>s.swaps&&s.swaps[i]&&EX[s.swaps[i]]?{...p,id:s.swaps[i]}:p)}}, exOf=(s,i)=>({...EX[dayOf(s).ex[i].id],...dayOf(s).ex[i]});

const doneSets=s=>dayOf(s).ex.reduce((a,x)=>a+((s.log[x.id]||[]).filter(Boolean).length),0);
const fmtW=w=>(Math.round(w*100)/100).toString();
const fmtSet=(x,v)=>x.timed?v.r+"s":fmtW(v.w)+"×"+v.r;
const e1=(v,x)=>x.timed||!v.w?v.r:v.w*(1+v.r/30);

function newSession(day){day=Math.min(day,PROGRAM.length-1);return {id:null,day,pname:PROGRAM[day].name,plan:clone(PROGRAM[day].ex),start:null,end:null,log:{},swaps:{},extra:[],prs:0,updatedAt:0}}
function boot(force){
  doneView=null; editMode=false;
  const open=sessions.filter(s=>!s.end&&Date.now()-s.start<12*36e5).sort((a,b)=>b.start-a.start)[0];
  const fin=sessions.filter(s=>s.end).sort((a,b)=>b.end-a.end)[0];
  if(open) S=open;
  else if(fin&&!force&&new Date(fin.end).toDateString()===new Date().toDateString()){S=null;doneView=fin}

}
function firstOpen(from){
  const d=dayOf(S).ex;
  for(let k=0;k<d.length;k++){const e=(from+k)%d.length,lg=S.log[d[e].id]||[];
    for(let s=0;s<d[e].sets;s++) if(!lg[s]) return {e,s};}
  return null;
}
function history(id){ // earlier sessions that contain this exercise, newest first
  return sessions.filter(s=>s!==S&&s.log[id]&&s.log[id].some(Boolean)&&(!S||!S.start||s.start<S.start)).sort((a,b)=>b.start-a.start);
}
function target(x,i){
  const last=history(x.id)[0];
  if(!last) return {w:x.start,r:x.lo,first:true};
  const arr=last.log[x.id].filter(Boolean), ref=last.log[x.id][i]||arr[arr.length-1];
  if(x.timed) return {w:0,r:Math.min(ref.r+5,x.hi),ref};

}
function initVals(){

  const t=target(x,cur.s), prev=lg.slice(0,cur.s).filter(Boolean).pop();

/* ---------- stick figures ---------- */

    l.map(x=>`<polyline class="bd" points="${pts(x)}"/>`).join("")+
    `<circle class="hd" cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="7.5"/>`+
    d.map(c=>`<circle class="pp" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${c[2]}"/>`).join("");
}
const PHOTO={"chest_press":0,"lat_pulldown":1,"shoulder_press":2,"seated_row":3,"lateral_raise":4,"curl":5,"pushdown":6,"leg_press":7,"rdl":8,"leg_ext":9,"leg_curl":10,"calf_raise":11,"plank":12,"split_squat":13,"incline_press":14,"cs_row":15,"hip_thrust":16,"db_bench":17,"goblet_squat":18,"hammer_curl":19,"machine_shoulder_press":20,"machine_row":21,"db_rdl":22,"push_up":23,"face_pull":24,"crunch":25,"pec_fly":26,"dip":27,"close_grip_pulldown":28,"pull_up":29,"one_arm_row":30,"back_extension":31,"cable_lateral":32,"reverse_fly":33,"incline_curl":34,"cable_curl":35,"overhead_ext":36,"skull_crusher":37,"smith_squat":38,"reverse_lunge":39,"lying_leg_curl":40,"glute_bridge":41,"seated_calf_raise":42,"hanging_knee_raise":43,"side_plank":44,"pallof_press":45,"woodchop":46,"barbell_squat":47,"bw_squat":48,"db_squat":49,"bulgarian":50,"pistol_squat":51,"step_up":52}; const PROWS=7;
let PHOTOS=true; /* switched off if the photo files cannot be loaded, so the sketches take over */
const hasPhoto=id=>PHOTOS&&PHOTO[id]!=null;
const figSVG=(id,live)=>{

  const n=PHOTO[id]; return `<span class="pht" aria-hidden="true" style="background-size:800% ${PROWS*100}%;background-position:${(n%8)/7*100}% ${Math.floor(n/8)/(PROWS-1)*100}%"></span>`;
};
const sketchSVG=(id,live)=>`<svg class="fig${live?" live":""}" data-ex="${id}" viewBox="0 0 120 100" aria-hidden="true">${figInner(EX[id].fig,live?0:.5)}</svg>`;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function figLoop(ts){
  if(!document.hidden) document.querySelectorAll("svg.fig.live").forEach(el=>{
    const ph=(ts%2600)/2600, t=ph<.42?ph/.42:ph<.5?1:ph<.92?1-(ph-.5)/.42:0, e=t*t*(3-2*t);

if(!still) requestAnimationFrame(figLoop);

/* ---------- rendering ---------- */
const CHECK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.2L20 6.5"/></svg>';

    const v=lg[s], now=S&&ei===cur.e&&s===cur.s, key=x.id+":"+s;
    h+=`<button type="button" class="chip${v?" done":""}${now?" now":""}${popKey===key?" pop":""}${v&&v.pr?" pr":""}" data-jump="${ei}:${s}" aria-label="Set ${s+1}${v?" logged "+fmtSet(x,v):""}">${v?fmtSet(x,v):s+1}</button>`;

}
function header(s){
  const tot=totalSets(s), dn=doneSets(s), p=tot?dn/tot:0;

  $("#pct").innerHTML=Math.round(p*100)+"<small>%</small>";
  $("#pg").style.strokeDashoffset=(207.3*(1-p)).toFixed(1);

}
const mins=s=>Math.max(1,Math.round(((s.end||Date.now())-s.start)/6e4));
const volume=s=>Math.round(dayOf(s).ex.reduce((a,x)=>a+(s.log[x.id]||[]).filter(Boolean).reduce((b,v)=>b+(EX[x.id].timed?0:v.w*v.r*(EX[x.id].each?2:1)),0),0));
function statsHTML(s){
  return `<div class="stats"><div><b>${doneSets(s)}</b><span>sets</span></div><div><b>${volume(s).toLocaleString()}</b><span>kg lifted</span></div><div><b>${mins(s)}</b><span>min</span></div></div>`;
}
function render(){

    :`<div class="steps${x.timed?" one":""}">${stepW}${stepR}</div>
    <div class="gorow">${editing?`<button type="button" class="del" id="del">Delete</button>`:""}<button type="button" class="go" id="go">${CHECK}<span>${editing?"Update set":"Log set"}</span></button></div>`}
  </section>

  });

/* ---------- program editor + library ---------- */
let lastFocus=null;
function snapRows(){const m={};document.querySelectorAll("#vProg [data-key]").forEach(el=>m[el.dataset.key]=el.getBoundingClientRect().top);return m}
function flip(before,moved){ // rows glide from where they were to where they are now
  if(still) return;
  document.querySelectorAll("#vProg [data-key]").forEach(el=>{
    const k=el.dataset.key, dy=before[k]-el.getBoundingClientRect().top; if(before[k]==null||!dy||!el.animate) return;
    const me=k===moved; el.style.position="relative"; el.style.zIndex=me?2:1;
    el.animate(me?[{transform:`translateY(${dy}px) scale(1)`,background:"var(--accent-soft)"},{transform:`translateY(${dy*.35}px) scale(1.05)`,background:"var(--accent-soft)",offset:.45},{transform:"none",background:"var(--card)"}]
      :[{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:me?460:380,easing:"cubic-bezier(.3,1.3,.5,1)"});

/* ---------- progress ---------- */
const fmtLong=(x,v)=>x.timed?v.r+" sec":(v.w?fmtW(v.w)+" kg × ":"")+v.r+(v.w?"":" reps");
const dstr=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function exSeries(id){
  const x=EX[id];
  return sessions.filter(s=>s.start&&s.log[id]&&s.log[id].some(Boolean)).sort((a,b)=>a.start-b.start).map(s=>{
    const sets=s.log[id].filter(Boolean); let best=sets[0]; sets.forEach(v=>{if(e1(v,x)>e1(best,x)) best=v});
    return {t:s.start,v:e1(best,x),best,sets};});
}

}
const pct=se=>se.length>1&&se[0].v?Math.round((se[se.length-1].v-se[0].v)/se[0].v*100):null;
let calAt=null;

/* ---------- actions ---------- */
function stepVal(k,dir){
  const x=exOf(S,cur.e);
  if(k==="w") vals.w=Math.max(0,Math.round((vals.w+dir*x.inc)*100)/100);
  else vals.r=Math.max(x.timed?5:1,vals.r+dir*(x.timed?5:1));
  const el=$(k==="w"?"#inW":"#inR"); if(!el) return;
  el.value=k==="w"?fmtW(vals.w):vals.r; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}
function readInputs(){
  const w=$("#inW"), r=$("#inR");
  if(w){const v=parseFloat(w.value); if(isFinite(v)&&v>=0) vals.w=v}
  if(r){const v=parseInt(r.value,10); if(isFinite(v)&&v>0) vals.r=v}
}
function logSet(){
  readInputs(); touched=true;
  const x=exOf(S,cur.e), v={w:x.timed?0:vals.w,r:vals.r};
  if(!S.start){S.start=Date.now();S.id="s"+S.start;sessions.push(S);wake()}
  const hist=history(x.id);
  if(hist.length){ // a record only counts against earlier workouts
    let best=0; hist.forEach(s=>s.log[x.id].filter(Boolean).forEach(o=>best=Math.max(best,e1(o,x))));
    (S.log[x.id]||[]).forEach((o,i)=>{if(o&&i!==cur.s) best=Math.max(best,e1(o,x))});
    if(e1(v,x)>best+1e-6) v.pr=true;
  }
  (S.log[x.id]=S.log[x.id]||[])[cur.s]=v;
  for(let i=0;i<S.log[x.id].length;i++) if(S.log[x.id][i]===undefined) S.log[x.id][i]=null;
  countPrs();
  popKey=x.id+":"+cur.s; save(S); hop();
  if(v.pr) burst(40);
  const wasEdit=editing, nxt=firstOpen(cur.e);
  if(editMode){ if(nxt&&!wasEdit) cur=nxt; initVals(); render(); return }
  if(!nxt){finish();return}
  cur=nxt; initVals(); render();
  if(!wasEdit) startRest(x.rest);
}
function countPrs(){S.prs=dayOf(S).ex.reduce((a,p)=>a+((S.log[p.id]||[]).filter(o=>o&&o.pr).length),0)}
function delSet(){
  const x=exOf(S,cur.e), lg=S.log[x.id]; if(!lg||!lg[cur.s]) return;
  lg[cur.s]=null; touched=true; countPrs(); save(S); initVals(); render();
}
function swapSheet(){
  const orig=baseOf(S)[cur.e].id, x=exOf(S,cur.e), used=dayOf(S).ex.map(p=>p.id);

  $("#sheet").innerHTML=`<div class="mus">For today only</div><h3>Swap ${x.name}</h3>${body}${!has&&cur.e>=planOf(S).length?`<button type="button" class="ghost" id="rmExtra">Remove from today</button>`:""}<button type="button" class="ghost" id="sheetClose">Cancel</button>`;

}

/* hold timer for timed exercises */

function startRest(sec){rest={end:Date.now()+sec*1e3,total:sec*1e3,done:0};$("#rest").hidden=false;$("#rest").classList.remove("go-now");$("#buddy").classList.add("rest");tick()}

/* confetti */
const fx=$("#fx"), ctx=fx.getContext("2d"); let parts=[], fxOn=false;
function burst(n){
  if(still) return;
  const dpr=Math.min(2,devicePixelRatio||1); fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#F04A3A","#FFC53D","#0E9C6E","#5B7CFA","#FF9D94"];
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.9, sp=6+Math.random()*9;
    parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3+Math.random()*4,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40});}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.vx*=.985;p.rot+=p.vr;p.life--;
    ctx.save();ctx.globalAlpha=Math.min(1,p.life/25);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
  if(parts.length) requestAnimationFrame(fxLoop); else fxOn=false;
}

/* ---------- storage: phone first, account copy when available ---------- */
const busy={}, dirty={};
function save(s){
  s.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}
  push(s);
}
async function push(s){
  if(!db||!s.id) return;
  dirty[s.id]=true; if(busy[s.id]) return; busy[s.id]=true; setSync("saving");
  try{ while(dirty[s.id]){dirty[s.id]=false; await db.collection("sessions").doc(s.id).set(JSON.parse(JSON.stringify(s)));} setSync("cloud"); }
  catch(e){ setSync("phone"); }
  busy[s.id]=false;
}
(async()=>{
  try{db=await (window.claude&&window.claude.use?window.claude.use("db"):null)}catch(e){db=null}
  if(!db) return;
  try{
    const snap=await db.collection("sessions").get(), seen={};
    snap.docs.forEach(d=>{const r=d.data(); if(!r||!r.id) return; seen[r.id]=1;
      const i=sessions.findIndex(s=>s.id===r.id);
      if(i<0) sessions.push(JSON.parse(JSON.stringify(r)));
      else if((r.updatedAt||0)>(sessions[i].updatedAt||0)&&sessions[i]!==S) sessions[i]=JSON.parse(JSON.stringify(r));});
    try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}
    setSync("cloud");
    sessions.forEach(s=>{if(s.id&&(!seen[s.id]||s===S)) push(s)});
    try{
      const pd=await db.doc("app/program").get(), r=pd.exists?pd.data():null;
      if(r&&cleanDays(r.days).length&&(r.updatedAt||0)>progAt){
        PROGRAM=cleanDays(r.days); progAt=r.updatedAt;
        try{localStorage.setItem(LSP,JSON.stringify({days:PROGRAM,updatedAt:progAt}))}catch(e){}
        if(S&&!S.start){S=newSession(S.day);cur={e:0,s:0};initVals();render()}
        if(view==="Prog") renderProg();
      }else if(progAt&&(!r||(r.updatedAt||0)<progAt)) pushProg();
    }catch(e){}
    if(!touched) boot();
  }catch(e){ setSync("phone"); }
})();

  const d=t.closest("[data-day]"); if(d&&S&&!S.start){S=newSession(+d.dataset.day);cur={e:0,s:0};touched=true;initVals();render();return}
  if(t.closest("#info")&&S){infoSheet(exOf(S,cur.e).id);return}
  if(t.closest("#sheetClose")||t.id==="sheetVeil"){$("#sheetVeil").hidden=true;return}
  if(t.closest("#finClose")){$("#finVeil").hidden=true;return}
  if(t.closest("#restSkip")){stopRest();return}
  if(t.closest("#restAdd")){if(rest){if(rest.done){rest={end:Date.now()+3e4,total:3e4,done:0};$("#rest").classList.remove("go-now");$("#buddy").classList.add("rest")}else{rest.end+=3e4;rest.total+=3e4}tick()}return}
  if(t.closest("#startNext")){touched=true;boot(true);scrollTo(0,0);return}
  const ea=t.closest("#early");
  if(ea){ if(Date.now()-earlyArmed<4000) finish(); else{earlyArmed=Date.now();ea.textContent="Tap again to finish now";} return}
});
document.addEventListener("change",e=>{if(e.target.id==="inW"||e.target.id==="inR"){readInputs();touched=true}
  if(e.target.dataset&&e.target.dataset.pname!=null){const i=+e.target.dataset.pname, v=e.target.value.trim(); if(v&&PROGRAM[i]){PROGRAM[i].name=v.slice(0,24);progChanged()}}});
document.addEventListener("input",e=>{if(e.target.id==="libQ"){libQ=e.target.value;libList()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S&&S.start) wake()});
boot();
{const probe=new Image(); probe.onerror=()=>{PHOTOS=false; render(); if(view==="Lib") renderLib(); if(view==="Prog") renderProg()}; probe.src="img/thumbs.jpg"}
</script>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* ---------- standalone extras: backup, persistent storage, offline ---------- */
(function(){
  const baseStats=renderStats;
  renderStats=function(){
    baseStats();
    const n=sessions.filter(s=>s.start).length;
    const sec=document.createElement("section");
    sec.className="focus backup";
    sec.innerHTML=`<h2 class="sm">Backup</h2><p class="note">Your workouts live on this phone only. Export a backup now and then, and keep it in Google Drive or email it to yourself. ${n} workout${n===1?"":"s"} saved.</p><div class="btns"><button type="button" class="ghost" id="bkExport">Export backup</button><button type="button" class="ghost" id="bkImport">Import backup</button></div><p class="note" id="bkMsg" aria-live="polite"></p>`;
    $("#vStats").appendChild(sec);
  };
  const msg=t=>{const m=$("#bkMsg"); if(m) m.textContent=t};
  function exportData(){
    const data={app:"lift-buddy",version:1,exportedAt:new Date().toISOString(),program:{days:PROGRAM,updatedAt:progAt},sessions};
    const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
    const a=document.createElement("a"), d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download="lift-buddy-backup-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    try{localStorage.setItem("liftbuddy.lastBackup",String(Date.now()))}catch(e){}
    msg("Backup saved to your Downloads folder.");
  }
  function importData(text){
    let d; try{d=JSON.parse(text)}catch(e){return msg("That file is not a Lift Buddy backup.")}
    if(!d||d.app!=="lift-buddy"||!Array.isArray(d.sessions)) return msg("That file is not a Lift Buddy backup.");
    let added=0, updated=0;
    d.sessions.forEach(r=>{
      if(!r||!r.id||!r.log) return;
      const i=sessions.findIndex(s=>s.id===r.id);
      if(i<0){sessions.push(r);added++}
      else if((r.updatedAt||0)>(sessions[i].updatedAt||0)){sessions[i]=r;updated++}
    });
    try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}
    if(d.program&&cleanDays(d.program.days).length&&(d.program.updatedAt||0)>=progAt){
      PROGRAM=cleanDays(d.program.days); progAt=d.program.updatedAt||Date.now();
      try{localStorage.setItem(LSP,JSON.stringify({days:PROGRAM,updatedAt:progAt}))}catch(e){}
    }
    touched=false; boot(); setView("Stats");
    msg("Imported "+added+" new workout"+(added===1?"":"s")+(updated?" and updated "+updated:"")+".");
  }
  document.addEventListener("click",e=>{
    if(e.target.closest("#bkExport")) exportData();
    if(e.target.closest("#bkImport")) $("#importFile").click();
  });
  $("#importFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>importData(String(r.result)); r.readAsText(f); e.target.value="";
  });
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
